# Налаштування вбудованої бази даних H2
spring.datasource.url=jdbc:h2:file:./data/trombonesdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Налаштування Hibernate / JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Увімкнення консолі H2 (можна буде переглядати базу через браузер на http://localhost:8080/h2-console)
spring.h2.console.enabled=true